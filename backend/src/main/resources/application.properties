spring.application.name=smart-water-system
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/smartwater1_db
spring.datasource.username=postgres
spring.datasource.password=2006
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migration Settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Security / JWT Configuration (Base64 key for HMAC-SHA256)
aquatrack.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
aquatrack.jwt.expiration-ms=86400000