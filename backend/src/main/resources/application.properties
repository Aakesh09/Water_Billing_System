spring.application.name=smart-water-system
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/smartwater1_db
spring.datasource.username=postgres
spring.datasource.password=2006
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration (Set to 'update' so Hibernate syncs columns)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migration Settings (Auto-repair checksums & bypass validation mismatches)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# Security / JWT Configuration
aquatrack.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
aquatrack.jwt.expiration-ms=86400000